<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;padding:0;background:transparent}
  .icon{
    width:512px;height:512px;border-radius:112px;
    background:linear-gradient(150deg,#0d3b45 0%,#0b6f66 58%,#0a8a7a 100%);
    position:relative;overflow:hidden;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);
  }
  .glow{position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle at 30% 25%,rgba(120,255,235,.35),rgba(120,255,235,0) 62%);
    left:-80px;top:-90px}
  .drop{
    position:absolute;left:50%;top:74px;transform:translateX(-50%);
    width:196px;height:196px;
    background:linear-gradient(160deg,#ffffff 0%,#d8fff7 45%,#7ef0dc 100%);
    border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
    rotate:45deg;
    border-radius: 0 50% 50% 50%;
    box-shadow:0 18px 40px rgba(0,0,0,.22);
  }
  .drop::after{
    content:"";position:absolute;left:26%;top:20%;width:28%;height:24%;
    border-radius:50%;background:rgba(255,255,255,.85);filter:blur(2px);
    rotate:-45deg;
  }
  .wave{position:absolute;left:-20%;width:140%;height:150px;border-radius:46%;
    border-top:14px solid rgba(255,255,255,.92);background:transparent}
  .w1{bottom:-44px;opacity:.95;transform:rotate(-4deg)}
  .w2{bottom:-86px;opacity:.42;border-top-color:#bff8ee}
  .w3{bottom:22px;opacity:.28;border-top-color:#eafffb;transform:rotate(5deg)}
  .dot{position:absolute;right:74px;bottom:118px;width:26px;height:26px;border-radius:50%;
    background:#ffd479;box-shadow:0 0 22px rgba(255,212,121,.7)}
  .leaf{position:absolute;left:56px;bottom:96px;width:76px;height:38px;
    border:10px solid rgba(210,255,244,.9);border-radius:0 100% 0 100%;
    border-left-color:transparent;border-bottom-color:transparent;rotate:-12deg}
</style>
</head>
<body>
  <div class="icon">
    <div class="glow"></div>
    <div class="wave w3"></div>
    <div class="wave w2"></div>
    <div class="wave w1"></div>
    <div class="drop"></div>
    <div class="leaf"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
